<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scout Theme Catcher</title>
    <style>
        body { 
            text-align: center; 
            background-color: #2b2b2b; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        canvas { 
            background-color: #e0e0e0; /* Default color if no image is used */
            cursor: crosshair; 
            border: 4px solid #555;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Theme Catcher!</h1>
    <h2>Score: <span id="score">0</span></h2>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        // ==========================================
        // 🛠️ SCOUT HACKER ZONE: EDIT THESE VARIABLES! 
        // ==========================================
        
        let targetSize = 60;       // How big is the target? (Default: 60)
        let gameSpeed = 1000;      // How fast it moves in milliseconds (1000 = 1 second)
        let pointsPerClick = 1;    // Points earned per click
        
        // 🎨 THEME SETTINGS
        // Paste a direct image link between the quotes (must end in .jpg, .png, or .gif)
        // Tip: Search for an image online, right-click, and select "Copy image address"
        
        // Example: "https://c02.purpledshub.com/uploads/sites/41/2020/07/GettyImages_10070316-c-f3dddad-scaled.jpg?w=1200&webp=1" (Sky)
        let backgroundImageUrl = ""; 
        
        // Example: "https://cdn-icons-png.flaticon.com/512/789/789395.png" Sun)
        let targetImageUrl = "";     
        
        // Fallback color if the target image URL above is left empty
        let targetColor = "red";   
        
        // ==========================================
        // GAME ENGINE: Only edit if you are brave!
        // ==========================================
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        
        let score = 0;
        let targetX = 100;
        let targetY = 100;

        // Apply background image if one is provided
        if (backgroundImageUrl !== "") {
            canvas.style.backgroundImage = "url('" + backgroundImageUrl + "')";
            canvas.style.backgroundSize = "cover";
            canvas.style.backgroundPosition = "center";
        }

        // Pre-load the target image
        const targetImg = new Image();
        if (targetImageUrl !== "") {
            targetImg.src = targetImageUrl;
        }

        function drawTarget() {
            // Clear the previous frame (background image stays because it's CSS)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw the target (either the image or the fallback colored box)
            if (targetImageUrl !== "") {
                ctx.drawImage(targetImg, targetX, targetY, targetSize, targetSize);
            } else {
                ctx.fillStyle = targetColor;
                ctx.fillRect(targetX, targetY, targetSize, targetSize);
            }
        }

        function moveTarget() {
            // Pick a random position inside the canvas bounds
            targetX = Math.random() * (canvas.width - targetSize);
            targetY = Math.random() * (canvas.height - targetSize);
            drawTarget();
        }

        // Listen for mouse clicks on the canvas
        canvas.addEventListener("mousedown", function(event) {
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            // Check if the click is inside the target box
            if (clickX >= targetX && clickX <= targetX + targetSize &&
                clickY >= targetY && clickY <= targetY + targetSize) {
                score += pointsPerClick;
                scoreDisplay.innerText = score;
                moveTarget(); // Move immediately when clicked
            }
        });

        // Start the game loop
        setInterval(moveTarget, gameSpeed);
        // Initial draw (slight delay ensures image has a moment to load)
        setTimeout(moveTarget, 50); 
    </script>
</body>
</html>
